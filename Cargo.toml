[package]
name = "raccoon"
version = "0.1.0"
edition = "2024"

[features]
default = ["onig"]
onig = ["syntect/regex-onig", "two-face/syntect-onig"]
fancy = ["syntect/regex-fancy", "two-face/syntect-fancy"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
directories = "6.0.0"
gix = "0.86.0"
lru = "0.18.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
two-face = { version = "0.5.2", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bench]]
name = "diff"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1
strip = false
