name="Night Owl"
appearance="dark"
author="Sarah Drasner"
source="https://github.com/sdras/night-owl-vscode-theme"
[palette]
background="#011627"
panel="#001122"
selection="#1D3B53"
border="#102A44"
foreground="#D6DEEB"
muted="#8BADC1"
comment="#637777"
cyan="#7FDBCA"
blue="#82AAFF"
purple="#C792EA"
yellow="#ECC48D"
orange="#F78C6C"
red="#EF5350"
green="#ADDB67"
pink="#FF5874"
[ui]
background="background"
foreground="foreground"
panel="panel"
border="border"
focused_border="blue"
selection="selection"
selection_foreground="foreground"
muted="muted"
accent="blue"
warning="yellow"
error="red"
info="cyan"
search_match="orange"
[diff]
header="purple"
hunk_header="blue"
gutter="border"
line_number="muted"
addition="green"
deletion="pink"
context="foreground"
metadata="muted"
addition_background="panel"
deletion_background="panel"
selected_background="selection"
[syntax]
comment="comment"
keyword="purple"
string="green"
number="orange"
function="blue"
type="cyan"
variable="foreground"
constant="yellow"
operator="cyan"
punctuation="muted"
property="cyan"
tag="pink"
attribute="yellow"
invalid="red"
